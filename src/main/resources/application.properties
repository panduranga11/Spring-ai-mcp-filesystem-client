spring.application.name=mcp-filesystem-client
server.port=8081

# =============================================================================
# Google Gemini / GenAI
# Do NOT hardcode your API key. Set the environment variable:
#   GOOGLE_API_KEY=your-key-here
# =============================================================================
spring.ai.google.genai.api-key=${GOOGLE_API_KEY}

# Gemini models (Oct 2026):
#   gemini-3.5-flash  → 15 RPM free tier ✅ USE THIS (avoids 429 errors)
#   gemini-3.8-flash  → 5 RPM free tier only (hits quota on multi-tool requests)
# DEPRECATED - DO NOT USE: gemini-2.0-flash, gemini-2.5-flash, gemini-2.5-pro
spring.ai.google.genai.chat.options.model=gemini-3.5-flash

# =============================================================================
# Spring AI MCP Client — STDIO transport
# Spring AI reads mcp-servers.json and auto-launches the Filesystem MCP server.
# You do NOT need to start the server manually.
# =============================================================================
spring.ai.mcp.client.enabled=true
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.request-timeout=60s
spring.ai.mcp.client.toolcallback.enabled=true

# Claude Desktop-compatible JSON file that defines which MCP servers to launch
spring.ai.mcp.client.stdio.servers-configuration=classpath:mcp-servers.json

# =============================================================================
# Logging
# =============================================================================
logging.level.root=INFO
logging.level.com.panduranga=DEBUG
logging.level.org.springframework.ai=DEBUG
logging.level.io.modelcontextprotocol=DEBUG
